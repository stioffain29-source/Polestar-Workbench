  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /access:
    get:
      tags: [Auth]
      operationId: getAccessStatus
      summary: Report whether the current session is the allowed owner
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Access status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessStatus'
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Topic:
      type: string
      enum:
        - fuel
        - flashpoint
        - protests
        - fertiliser
        - energy
        - shipping
        - cargo_watch
        - conflict

    Severity:
      type: string
      enum: [insignificant, low, moderate, high, extreme]

    Confidence:
      type: string
      enum: [low, medium, high]

    StrikeTheatre:
      type: string
      enum: [maritime_hormuz, land_gcc]

    Munition:
      type: string
      enum: [drone, ballistic_missile, cruise_missile, mixed, unknown]

    InfrastructureCategory:
      type: string
      enum:
        - government
        - power
        - military
        - civilian_residential
        - port
        - airport
        - oil_gas
        - industrial
        - commercial
        - unknown

    TargetCategory:
      type: string
      enum:
        - military_site
        - government_facility
        - energy_infrastructure
        - port_maritime
        - airport_aviation
        - civilian_area
        - commercial_site
        - industrial_site
        - vessel
        - unknown

    SourceType:
      type: string
      enum: [rss, api, scraper, manual, social, government, news]

    SourceStatus:
      type: string
      enum: [operational, delayed, stale, failing, blocked, not_configured, pending]

    ReportStatus:
      type: string
      enum: [draft, review, published]

    SpotReportStatus:
      type: string
      enum: [draft, final]

    Corroboration:
      type: object
      description: >-
        An independent OFFICIAL corroborating reference for an incident (e.g. a
        UN OCHA ReliefWeb report covering the same country, timeframe and event).
        A separate signal — it never overwrites the incident's confidence.
      required: [id, provider, reportTitle, url, matchScore]
      properties:
        id: { type: integer }
        provider: { type: string }
        reportTitle: { type: string }
        sourceAgency: { type: ["string", "null"] }
        reportDate: { type: ["string", "null"], format: date-time }
        url: { type: string }
        matchScore: { type: number }

    Incident:
      type: object
      required: [id, topic, title, summary, country, occurredAt, severity, confidence, createdAt, corroborations]
      properties:
        id: { type: integer }
        topic: { $ref: "#/components/schemas/Topic" }
        title: { type: string }
        displayTitle: { type: ["string", "null"] }
        summary: { type: string }
        country: { type: string }
        location: { type: ["string", "null"] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        occurredAt: { type: string, format: date-time }
        severity: { $ref: "#/components/schemas/Severity" }
        confidence: { $ref: "#/components/schemas/Confidence" }
        source: { type: ["string", "null"] }
        sourceUrl: { type: ["string", "null"] }
        # Real publisher URL resolved from a Google News RSS redirect, when
        # available. Clients should prefer this over sourceUrl for the analyst
        # "source" link, falling back to sourceUrl when null.
        resolvedUrl: { type: ["string", "null"] }
        analystNotes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        corroborations:
          type: array
          items: { $ref: "#/components/schemas/Corroboration" }
        # PNG country-report enrichment (additive, nullable). The structured
        # extraction the ingest derives for Papua New Guinea items (province /
        # category / business-impact / occurred-vs-reported date). Null for
        # non-PNG / not-yet-extracted rows; consumers fall back to
        # location/topic/occurredAt when absent.
        incidentDate: { type: ["string", "null"], format: date-time }
        province: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        businessImpact: { type: ["string", "null"] }
        # GDELT precision-enrichment fields (additive). Null unless the GDELT
        # pass matched this incident to a structured ACLED-style event; every
        # surface falls back to the base fields when absent.
        fatalities: { type: ["integer", "null"] }
        actors: { type: ["string", "null"] }
        gdeltEventType: { type: ["string", "null"] }
        gdeltSubEventType: { type: ["string", "null"] }
        gdeltConfidence: { type: ["number", "null"] }
        gdeltEnrichedAt: { type: ["string", "null"], format: date-time }
        # Analyst review override (additive). True when an analyst resolved a
        # Cargo Watch "needs review" incident by assigning its country — the row
        # is then authoritative for the in-scope main lane. Null for scraper rows.
        analystInScope: { type: ["boolean", "null"] }

    IncidentInput:
      type: object
      required: [topic, title, summary, country, occurredAt, severity, confidence]
      properties:
        topic: { $ref: "#/components/schemas/Topic" }
        title: { type: string, minLength: 1 }
        summary: { type: string }
        country: { type: string }
        location: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        occurredAt: { type: string, format: date-time }
        severity: { $ref: "#/components/schemas/Severity" }
        confidence: { $ref: "#/components/schemas/Confidence" }
        source: { type: string }
        sourceUrl: { type: string }
        analystNotes: { type: string }

    IncidentUpdate:
      type: object
      properties:
