    SocialWatchStatus:
      type: string
      enum: [planned, active, dispersed, cancelled, unclear]
      description: >-
        Derived protest status of a social-watch item: planned (announced /
        mobilisation), active (confirmed under way), dispersed (broken up / clash
        / arrests), cancelled (called off / postponed), or unclear.

    CreateSocialWatchItemRequest:
      type: object
      description: >-
        A manually-pasted KAMMI protest-watch item (analyst hand-entry). Stored
        as supporting CONTEXT only — it never becomes or inflates an incident.
        The server sanitises the caption and RE-DERIVES status, promotability,
        location, issue, event date/time and watch-alerts from the pasted text;
        client-supplied derived fields are advisory hints, never trusted for
        promotion eligibility.
      required: [platform, url, caption]
      properties:
        platform:
          type: string
          enum: [instagram, telegram]
          description: The platform the post was seen on.
        url:
          type: string
          description: Public URL of the post.
        caption:
          type: string
          description: The post text / caption, pasted verbatim. Sanitised server-side.
        actor:
          type: string
          description: Organiser / account (defaults to "KAMMI Pusat").
        channel:
          type: string
          description: Account handle the post was read from (defaults per platform).
        postedAt:
          type: ["string", "null"]
          format: date-time
          description: When the post was published, if known.
        eventDate:
          type: ["string", "null"]
          format: date-time
          description: >-
            Explicit protest/event date, if the analyst knows it. Overrides the
            best-effort date parsed from the caption when provided.
        eventTimeText:
          type: string
          description: >-
            Free-text start time, e.g. "13.00 WIB" (display only). Overrides the
            time parsed from the caption when provided.
        location:
          type: string
          description: >-
            Venue / location, e.g. "Gedung DPR/MPR RI". Overrides the location
            parsed from the caption when provided.
        city:
          type: string
          description: City (defaults to Jakarta). Overrides the parsed city when provided.
        province:
          type: string
          description: Province, when known. Overrides the parsed province when provided.
        issue:
          type: string
          description: >-
            Issue / campaign, e.g. "Indonesia Darurat". Overrides the issue
            parsed from the caption when provided.
        imageUrls:
          type: array
          items: { type: string }
          description: Public image URL(s) attached to the post.
        status:
          $ref: "#/components/schemas/SocialWatchStatus"
        confidence:
          type: string
          description: Analyst confidence (high | medium | low); defaults to medium.

    UpdateSocialWatchItemRequest:
      type: object
      description: >-
        An in-place correction of a hand-entered KAMMI protest-watch context row
        (fix a typo, a wrong location, a missing URL, the event date/time or
        status). All fields are optional; omitted fields keep their stored value.
        The row stays supporting CONTEXT only — editing it never becomes or
        inflates an incident. The server sanitises the caption and RE-DERIVES
        status, promotability, location, issue, event date/time and watch-alerts
        from the edited text; client-supplied derived fields are advisory hints,
        never trusted for promotion eligibility.
      properties:
        platform:
          type: string
          enum: [instagram, telegram]
          description: The platform the post was seen on.
        url:
          type: string
          description: Public URL of the post.
        caption:
          type: string
          description: The post text / caption, pasted verbatim. Sanitised server-side.
        actor:
          type: string
          description: Organiser / account.
        channel:
          type: string
          description: Account handle the post was read from.
        postedAt:
          type: ["string", "null"]
          format: date-time
          description: When the post was published, if known.
        eventDate:
          type: ["string", "null"]
          format: date-time
          description: >-
            Explicit protest/event date, if the analyst knows it. Overrides the
            best-effort date parsed from the caption when provided.
        eventTimeText:
          type: string
          description: >-
            Free-text start time, e.g. "13.00 WIB" (display only). Overrides the
            time parsed from the caption when provided.
        location:
          type: string
          description: >-
            Venue / location, e.g. "Gedung DPR/MPR RI". Overrides the location
            parsed from the caption when provided.
        city:
          type: string
          description: City. Overrides the parsed city when provided.
        province:
          type: string
          description: Province, when known. Overrides the parsed province when provided.
        issue:
          type: string
          description: >-
            Issue / campaign, e.g. "Indonesia Darurat". Overrides the issue
            parsed from the caption when provided.
        imageUrls:
          type: array
          items: { type: string }
          description: Public image URL(s) attached to the post.
        status:
          $ref: "#/components/schemas/SocialWatchStatus"
        confidence:
          type: string
          description: Analyst confidence (high | medium | low).

    SocialWatchItem:
      type: object
      description: >-
        A KAMMI Pusat public Instagram protest-watch item stored as
        supporting CONTEXT. NOT an incident: these rows live in their own table
        and never feed any incident count. The only path into incidents is the
        explicit promote action, which sets promotedIncidentId.
      required: [id, platform, channel, status, confidence, url, classification, promotable]
      properties:
        id: { type: integer }
