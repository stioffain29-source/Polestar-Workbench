      type: object
      description: One bar in a card-native chart. `value` drives the bar length; `valueLabel` is the formatted text shown (e.g. '$2.4M') and falls back to the numeric value.
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
        valueLabel: { type: string, description: "Optional formatted display value (e.g. '$2.4M'); falls back to the numeric value." }
        rating: { type: string, description: "Optional risk tier key ('insignificant'..'extreme') to colour the bar; falls back to brand electric." }

    CardChart:
      type: object
      description: A card-native bar chart rebuilt from a dashboard's data. Rendered as plain HTML/div bars (never SVG) so it rasterises cleanly into the exported PNG.
      properties:
        title: { type: string }
        note: { type: string, description: "Optional caption under the chart (e.g. 'Top 6 / source-stated USD only')." }
        bars:
          type: array
          items: { $ref: "#/components/schemas/CardChartBar" }

