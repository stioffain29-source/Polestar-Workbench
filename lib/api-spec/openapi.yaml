          items: { $ref: "#/components/schemas/CardHighlight" }
        rating: { type: string }
        ratingNote: { type: string, description: "Optional one-line descriptor under the rating; falls back to a per-tier default." }
        outlook: { type: string }
        mapLocation: { type: string }
        mapImage: { type: string }
        mapMode: { type: string, description: "Visual panel mode: 'image' (uploaded), 'map' (rendered Leaflet map), or 'chart' (card-native bar chart from a dashboard)." }
        mapLat: { type: number, description: "Map centre / marker latitude when mapMode is 'map'." }
        mapLng: { type: number, description: "Map centre / marker longitude when mapMode is 'map'." }
        mapZoom: { type: number, description: "Optional Leaflet zoom level when mapMode is 'map'." }
