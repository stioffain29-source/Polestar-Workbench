openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Polestar Advisory Workbench API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: incidents
  - name: strikes
  - name: sources
  - name: reports
  - name: countries
  - name: dashboard
  - name: cards

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Operational overview across all topic areas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"

  /market-prices:
    get:
      operationId: listMarketPrices
      tags: [market-prices]
      summary: Live commodity-price snapshots for the Fuel / Energy / Fertiliser monitors
      parameters:
        - name: group
          in: query
          description: Limit to one monitor group (fuel | energy | fertiliser)
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketPrice" }

  /incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      parameters:
        - name: topic
          in: query
          schema: { $ref: "#/components/schemas/Topic" }
        - name: country
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { $ref: "#/components/schemas/Severity" }
        - name: days
          in: query
          description: Limit to incidents within the past N days
          schema: { type: integer, minimum: 1, maximum: 365 }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Incident" }
    post:
      operationId: createIncident
      tags: [incidents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }

  /incidents/{id}:
    get:
      operationId: getIncident
      tags: [incidents]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
    patch:
      operationId: updateIncident
      tags: [incidents]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
    delete:
      operationId: deleteIncident
      tags: [incidents]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /incidents/recent:
    get:
      operationId: getRecentIncidents
      tags: [incidents]
      summary: Recent priority incidents across all topics
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Incident" }

  /incidents/by-topic:
    get:
      operationId: getIncidentCountsByTopic
      tags: [incidents]
      summary: Counts of recent incidents grouped by topic
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TopicCount" }

  /strikes:
    get:
      operationId: listStrikes
      tags: [strikes]
      parameters:
        - name: theatre
          in: query
          schema: { $ref: "#/components/schemas/StrikeTheatre" }
        - name: country
          in: query
          schema: { type: string }
        - name: days
          in: query
          description: Limit to strikes within the past N days
          schema: { type: integer, minimum: 1, maximum: 365 }
        - name: munition
          in: query
          schema: { $ref: "#/components/schemas/Munition" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Strike" }
    post:
      operationId: createStrike
      tags: [strikes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StrikeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Strike" }

  /strikes/{id}:
    get:
      operationId: getStrike
      tags: [strikes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Strike" }
    patch:
      operationId: updateStrike
      tags: [strikes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StrikeUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Strike" }
    delete:
      operationId: deleteStrike
      tags: [strikes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /strikes/summary:
    get:
      operationId: getStrikeSummary
      tags: [strikes]
      summary: Aggregated strike counts by munition, infrastructure, and timeline
      parameters:
        - name: theatre
          in: query
          schema: { $ref: "#/components/schemas/StrikeTheatre" }
        - name: days
          in: query
          schema: { type: integer, enum: [7, 14, 30, 60, 90, 120] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrikeSummary" }

  /sources:
    get:
      operationId: listSources
      tags: [sources]
      parameters:
        - name: topic
          in: query
          schema: { $ref: "#/components/schemas/Topic" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SourceStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Source" }
    post:
      operationId: createSource
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }

  /sources/{id}:
    patch:
      operationId: updateSource
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
    delete:
      operationId: deleteSource
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /sources/health:
    get:
      operationId: getSourceHealth
      tags: [sources]
      summary: Source health summary counts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceHealth" }

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      parameters:
        - name: topic
          in: query
          schema: { $ref: "#/components/schemas/Topic" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ReportStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
    post:
      operationId: createReport
      tags: [reports]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
    patch:
      operationId: updateReport
      tags: [reports]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
    delete:
      operationId: deleteReport
      tags: [reports]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /spot-reports:
    get:
      operationId: listSpotReports
      tags: [spotReports]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SpotReportStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SpotReport" }
    post:
      operationId: createSpotReport
      tags: [spotReports]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpotReportInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotReport" }

  /spot-reports/{id}:
    get:
      operationId: getSpotReport
      tags: [spotReports]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotReport" }
    patch:
      operationId: updateSpotReport
      tags: [spotReports]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpotReportUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotReport" }
    delete:
      operationId: deleteSpotReport
      tags: [spotReports]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /spot-reports/{id}/exports:
    post:
      operationId: appendSpotReportExport
      tags: [spotReports]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpotReportExportInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotReport" }

  /card-drafts:
    get:
      operationId: listCardDrafts
      tags: [cards]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CardDraft" }
    post:
      operationId: createCardDraft
      tags: [cards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardDraftInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardDraft" }

  /card-drafts/{id}:
    get:
      operationId: getCardDraft
      tags: [cards]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardDraft" }
    patch:
      operationId: updateCardDraft
      tags: [cards]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardDraftUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardDraft" }
    delete:
      operationId: deleteCardDraft
      tags: [cards]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /card-templates:
    get:
      operationId: listCardTemplates
      tags: [cards]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CardTemplate" }
    post:
      operationId: createCardTemplate
      tags: [cards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardTemplateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardTemplate" }

  /card-templates/{id}:
    get:
      operationId: getCardTemplate
      tags: [cards]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardTemplate" }
    patch:
      operationId: updateCardTemplate
      tags: [cards]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardTemplateUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardTemplate" }
    delete:
      operationId: deleteCardTemplate
      tags: [cards]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /brand-settings:
    get:
      operationId: getBrandSettings
      tags: [cards]
      summary: Card-builder brand configuration (singleton)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandSettings" }
    put:
      operationId: updateBrandSettings
      tags: [cards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandSettingsUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandSettings" }

  /countries:
    get:
      operationId: listCountryReports
      tags: [countries]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CountryReport" }
    post:
      operationId: createCountryReport
      tags: [countries]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CountryReportInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountryReport" }

  /countries/{slug}/baseline:
    get:
      operationId: getCountryBaseline
      tags: [countries]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountryBaseline" }
        "404":
          description: No baseline curated for this country
    put:
      operationId: upsertCountryBaseline
      tags: [countries]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CountryBaselineInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountryBaseline" }
    delete:
      operationId: deleteCountryBaseline
      tags: [countries]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /countries/{slug}:
    get:
      operationId: getCountryReport
      tags: [countries]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountryReport" }
    patch:
      operationId: updateCountryReport
      tags: [countries]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CountryReportUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountryReport" }

  /countries/{slug}/prose:
    post:
      operationId: generateCountryProse
      tags: [countries]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateCountryProseInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountryProseResult" }
        "404":
          description: Country not found
        "503":
          description: Prose generation unavailable

  /countries/{slug}/prose/edit:
    put:
      operationId: editCountryProse
      tags: [countries]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditCountryProseInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountryProseResult" }
        "404":
          description: No generated prose to edit
        "409":
          description: Fingerprint stale, regenerate first

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Topic:
      type: string
      enum:
        - fuel
        - flashpoint
        - protests
        - fertiliser
        - energy
        - shipping
        - cargo_watch
        - conflict

    Severity:
      type: string
      enum: [insignificant, low, moderate, high, extreme]

    Confidence:
      type: string
      enum: [low, medium, high]

    StrikeTheatre:
      type: string
      enum: [maritime_hormuz, land_gcc]

    Munition:
      type: string
      enum: [drone, ballistic_missile, cruise_missile, mixed, unknown]

    InfrastructureCategory:
      type: string
      enum:
        - government
        - power
        - military
        - civilian_residential
        - port
        - airport
        - oil_gas
        - industrial
        - commercial
        - unknown

    TargetCategory:
      type: string
      enum:
        - military_site
        - government_facility
        - energy_infrastructure
        - port_maritime
        - airport_aviation
        - civilian_area
        - commercial_site
        - industrial_site
        - vessel
        - unknown

    SourceType:
      type: string
      enum: [rss, api, scraper, manual, social, government, news]

    SourceStatus:
      type: string
      enum: [operational, delayed, stale, failing, blocked, not_configured]

    ReportStatus:
      type: string
      enum: [draft, review, published]

    SpotReportStatus:
      type: string
      enum: [draft, final]

    Incident:
      type: object
      required: [id, topic, title, summary, country, occurredAt, severity, confidence, createdAt]
      properties:
        id: { type: integer }
        topic: { $ref: "#/components/schemas/Topic" }
        title: { type: string }
        displayTitle: { type: ["string", "null"] }
        summary: { type: string }
        country: { type: string }
        location: { type: ["string", "null"] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        occurredAt: { type: string, format: date-time }
        severity: { $ref: "#/components/schemas/Severity" }
        confidence: { $ref: "#/components/schemas/Confidence" }
        source: { type: ["string", "null"] }
        sourceUrl: { type: ["string", "null"] }
        analystNotes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    IncidentInput:
      type: object
      required: [topic, title, summary, country, occurredAt, severity, confidence]
      properties:
        topic: { $ref: "#/components/schemas/Topic" }
        title: { type: string, minLength: 1 }
        summary: { type: string }
        country: { type: string }
        location: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        occurredAt: { type: string, format: date-time }
        severity: { $ref: "#/components/schemas/Severity" }
        confidence: { $ref: "#/components/schemas/Confidence" }
        source: { type: string }
        sourceUrl: { type: string }
        analystNotes: { type: string }

    IncidentUpdate:
      type: object
      properties:
        topic: { $ref: "#/components/schemas/Topic" }
        title: { type: string }
        summary: { type: string }
        country: { type: string }
        location: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        occurredAt: { type: string, format: date-time }
        severity: { $ref: "#/components/schemas/Severity" }
        confidence: { $ref: "#/components/schemas/Confidence" }
        source: { type: string }
        sourceUrl: { type: string }
        analystNotes: { type: string }

    TopicCount:
      type: object
      required: [topic, count, criticalCount]
      properties:
        topic: { $ref: "#/components/schemas/Topic" }
        count: { type: integer }
        criticalCount: { type: integer }

    Strike:
      type: object
      required:
        - id
        - theatre
        - country
        - occurredAt
        - munition
        - targetCategory
        - infrastructure
        - confidence
        - createdAt
      properties:
        id: { type: integer }
