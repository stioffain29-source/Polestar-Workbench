        country: { type: string }
        eventDate: { type: string }
        eventTime: { type: string, description: "Optional time-of-day line shown beside the date in the card header meta column." }
        headline: { type: string }
        bluf: { type: string }
        keyPoints:
          type: array
          items: { type: string }
        highlights:
          type: array
