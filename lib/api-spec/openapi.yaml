        tankersCount: { type: ["integer", "null"] }
        bulkCarriersCount: { type: ["integer", "null"] }
        containerCount: { type: ["integer", "null"] }
        lngLpgCount: { type: ["integer", "null"] }
        anchoredOrWaitingCount: { type: ["integer", "null"] }
        aisVisibleCount: { type: ["integer", "null"] }
        aisDarkOrGapCount: { type: ["integer", "null"] }
        changeVs7DayBaseline: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        confidence: { type: string }
        sourceName: { type: string }
        sourceUrl: { type: ["string", "null"] }
        rawPayload: {}
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MaritimeMovementInput:
      type: object
      description: >-
        Manual upload payload for one movement snapshot from a licensed provider.
        All count fields are optional; omit a count to record it as "not
        reported" rather than zero.
      required: [theatre, dataAsOf, sourceName]
      properties:
        theatre: { type: string, minLength: 1 }
        chokepoint: { type: ["string", "null"] }
        dataAsOf: { type: string, format: date-time }
        totalVessels: { type: ["integer", "null"], minimum: 0 }
        inboundCount: { type: ["integer", "null"], minimum: 0 }
        outboundCount: { type: ["integer", "null"], minimum: 0 }
        tankersCount: { type: ["integer", "null"], minimum: 0 }
        bulkCarriersCount: { type: ["integer", "null"], minimum: 0 }
        containerCount: { type: ["integer", "null"], minimum: 0 }
        lngLpgCount: { type: ["integer", "null"], minimum: 0 }
        anchoredOrWaitingCount: { type: ["integer", "null"], minimum: 0 }
        aisVisibleCount: { type: ["integer", "null"], minimum: 0 }
        aisDarkOrGapCount: { type: ["integer", "null"], minimum: 0 }
        changeVs7DayBaseline: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        confidence:
          type: string
          enum: [low, medium, high]
          default: medium
        sourceName: { type: string, minLength: 1 }
        sourceUrl: { type: ["string", "null"] }
        rawPayload: {}

    MaritimeVessel:
      type: object
      description: >-
        One vessel's most recent live AIS position inside a tracked chokepoint,
        for the interactive map. CONTEXT only — a position is never an incident
        and never inflates any incident count. `vesselClass` is derived from the
        AIS ship-type code: tanker (80-89), cargo (70-89 not tanker) or other.
      required: [mmsi, theatre, latitude, longitude, lastSeenAt]
      properties:
        mmsi: { type: integer }
        name: { type: ["string", "null"] }
        theatre: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        courseOverGround: { type: ["number", "null"] }
        speedOverGround: { type: ["number", "null"] }
        navStatus: { type: ["integer", "null"] }
        shipType: { type: ["integer", "null"] }
        vesselClass:
          type: string
          enum: [tanker, cargo, other]
        lastSeenAt: { type: string, format: date-time }

