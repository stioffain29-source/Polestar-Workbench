openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Polestar Advisory Workbench API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: incidents
  - name: strikes
  - name: sources
  - name: reports
  - name: countries
  - name: dashboard
  - name: cards
  - name: liveuamap
  - name: integrations
  - name: gdelt-structured
  - name: Auth
    description: Browser and mobile authentication endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Operational overview across all topic areas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"

  /market-prices:
    get:
      operationId: listMarketPrices
      tags: [market-prices]
      summary: Live commodity-price snapshots for the Fuel / Energy / Fertiliser monitors
      parameters:
        - name: group
          in: query
          description: Limit to one monitor group (fuel | energy | fertiliser)
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketPrice" }

  /maritime-movement:
    get:
      operationId: listMaritimeMovement
      tags: [maritime-movement]
      summary: >-
        Maritime vessel-MOVEMENT context snapshots (AIS-derived traffic). Context
        only — never incidents. An empty list means movement data is unavailable.
      parameters:
        - name: theatre
          in: query
          description: Limit to one theatre (exact match), e.g. "Strait of Hormuz"
          schema: { type: string }
        - name: limit
          in: query
          description: Max number of most-recent snapshots to return (1-200)
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaritimeMovement" }
    post:
      operationId: createMaritimeMovement
      tags: [maritime-movement]
      summary: >-
        Manual upload of one movement snapshot from a licensed provider
        (admin-token-gated; there is no AIS API). Movement is context, never an
        incident.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaritimeMovementInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaritimeMovement" }

  /maritime-movement/latest:
    get:
      operationId: listLatestMaritimeMovement
      tags: [maritime-movement]
      summary: The latest movement snapshot per theatre (one row per theatre).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaritimeMovement" }

  /maritime-movement/vessels:
    get:
      operationId: listMaritimeVessels
      tags: [maritime-movement]
      summary: >-
        Individual live vessel POSITIONS (last AIS sighting per MMSI) for the
        interactive map. Context only — never incidents. Each row is a vessel's
        most recent transmitted position inside a tracked chokepoint. An empty
        list means no live position data is available.
      parameters:
        - name: theatre
          in: query
          description: Limit to one theatre (exact match), e.g. "Singapore Strait"
          schema: { type: string }
        - name: maxAgeHours
          in: query
          description: >-
            Only return vessels last seen within this many hours (1-168, default
            24). Older sightings are stale positions and excluded.
          schema: { type: integer, minimum: 1, maximum: 168 }
        - name: limit
          in: query
          description: Max number of vessels to return (1-2000, default 1000)
          schema: { type: integer, minimum: 1, maximum: 2000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaritimeVessel" }

  /liveuamap/events:
    get:
      operationId: listLiveuamapEvents
      tags: [liveuamap]
      summary: Live conflict-event points from Liveuamap for a region (cached server-side proxy)
      parameters:
        - name: region
          in: query
          description: Approved APAC / Middle East region to fetch
          schema: { $ref: "#/components/schemas/LiveuamapRegion" }
        - name: count
          in: query
          description: Max number of latest events to return (1-100)
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveuamapEventsResponse" }

  /reliefweb-reports:
    get:
      operationId: listReliefWebReports
      tags: [reliefweb-reports]
      summary: >-
        UN OCHA ReliefWeb situational reports stored as supporting CONTEXT (never
        as incidents, so they never inflate any count) for the monitored APAC
        countries.
      parameters:
        - name: country
          in: query
          description: Limit to one primary country (exact match on the ReliefWeb country name)
          schema: { type: string }
        - name: limit
          in: query
          description: Max number of most-recent reports to return (1-100)
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReliefWebReport" }

  /gdelt-structured-items:
    get:
      operationId: listGdeltStructuredItems
      tags: [gdelt-structured]
      summary: >-
        GDELT Cloud structured event layer — daily Events + Stories for the
        monitored APAC countries, stored as a standalone STRUCTURED CONTEXT
        layer in its own table (never as incidents, so they never inflate any
        count or reach a report/PDF). Events are bucketed into lanes; Indonesian
        items are sub-bucketed (Jakarta / Indonesian Papua). Most-recent first.
      parameters:
        - name: lane
          in: query
          description: Limit to one derived lane (events only; stories have no lane)
          schema: { $ref: "#/components/schemas/GdeltLane" }
        - name: country
          in: query
          description: Limit to one country (exact match on GDELT's country name)
          schema: { type: string }
        - name: subBucket
          in: query
          description: Limit to one tracked Indonesian sub-bucket
          schema: { $ref: "#/components/schemas/GdeltSubBucket" }
        - name: kind
          in: query
          description: Limit to one item kind (event or story)
          schema: { type: string, enum: [event, story] }
        - name: days
          in: query
          description: >-
            Only return items whose source date is within this many days (1-30,
            default 30). The collector never stores items older than 30 days.
          schema: { type: integer, minimum: 1, maximum: 30 }
        - name: limit
          in: query
          description: Max number of most-recent items to return (1-500, default 200)
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GdeltStructuredItem" }

  /social-watch:
    get:
      operationId: listSocialWatchItems
      tags: [social-watch]
      summary: >-
        KAMMI Pusat public Instagram protest-watch items, stored as
        supporting CONTEXT (never as incidents, so they never inflate any count).
        The only path into incidents is the explicit promote action.
      parameters:
        - name: status
          in: query
          description: Filter to one derived status
          schema: { $ref: "#/components/schemas/SocialWatchStatus" }
        - name: platform
          in: query
          description: Filter to one platform (instagram | telegram)
          schema: { type: string, enum: [instagram, telegram] }
        - name: promotable
          in: query
          description: Limit to items eligible for promotion to an incident
          schema: { type: boolean }
        - name: limit
          in: query
          description: Max number of most-recent items to return (1-200)
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialWatchItem" }
    post:
      operationId: createSocialWatchItem
      tags: [social-watch]
      summary: >-
        Manually add a KAMMI Instagram/Telegram protest-watch item by hand
        (analyst paste — no scraping, no API keys). The pasted item is stored as
        supporting CONTEXT only: it lands in the social-watch table and NEVER
        becomes or inflates an incident. Its status is re-classified and its
        promotability, location, issue, event time and watch-alerts are all
        re-derived server-side from the pasted text, exactly like a scraped item.
        Re-pasting the same content is idempotent (deduped to one row).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CreateSocialWatchItemRequest" }
      responses:
        "200":
          description: >-
            OK — an item with identical content already existed; the existing row
            is returned unchanged (idempotent re-paste).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialWatchItem" }
        "201":
          description: Created — the new watch item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialWatchItem" }
        "400":
          description: Invalid request body

  /social-watch/{id}:
    patch:
      operationId: updateSocialWatchItem
      tags: [social-watch]
      summary: >-
        Correct a single hand-entered social-watch context row in place (fix a
        typo in the caption, a wrong location, a missing URL, the event
        date/time or status) instead of deleting and re-pasting it. The item
        stays supporting CONTEXT only — editing it NEVER becomes or inflates an
        incident, and never changes any incident count. Status, promotability,
        location, issue, event time and watch-alerts are all RE-DERIVED
        server-side from the edited text, exactly like create — a client can
        never claim an item is promotable. Refuses (409) once the item has been
        promoted to an incident; edit the incident directly instead.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateSocialWatchItemRequest" }
      responses:
        "200":
          description: OK — the updated watch item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialWatchItem" }
        "400":
          description: Invalid item id or request body
        "404":
          description: Item not found
        "409":
          description: >-
            Item already promoted (cannot be edited as context), or the edit
            would collide with another item's content.
    delete:
      operationId: deleteSocialWatchItem
      tags: [social-watch]
      summary: >-
        Remove a single hand-entered social-watch context row (wrong URL,
        duplicate, off-topic paste). Deletes ONLY the context row — it never
        touches any incident, so no incident count changes. Refuses (409) if the
        item was already promoted to an incident; delete the incident first.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid item id
        "404":
          description: Item not found
        "409":
          description: Item already promoted — cannot be removed as context

  /social-watch/{id}/promote:
    post:
      operationId: promoteSocialWatchItem
      tags: [social-watch]
      summary: >-
        Promote a confirmed-active social-watch item into a flashpoint incident
        (Indonesia). Only items whose text/image confirms the protest is active
        are eligible; planned/mobilisation, cancelled and unclear items are
        rejected. The created incident links back to the source post.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Created — the new incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "404":
          description: Item not found
        "409":
          description: Item not promotable, or already promoted

  /social-raw:
    get:
      operationId: listSocialRawItems
      tags: [social-raw]
      summary: >-
        Facebook OSINT monitoring items for the Papua New Guinea + Indonesian
        Papua theatres, stored as supporting CONTEXT (never as incidents, so they
        never inflate any count). The only path into incidents is the explicit,
        server-re-derived promote action.
      parameters:
        - name: country
          in: query
          description: Filter to one theatre (Papua New Guinea | Indonesia)
          schema: { type: string }
        - name: category
          in: query
          description: Filter to one security category
          schema: { type: string }
        - name: promotable
          in: query
          description: Limit to items eligible for promotion to an incident
          schema: { type: boolean }
        - name: promoted
          in: query
          description: Filter by whether the item has already been promoted
          schema: { type: boolean }
        - name: reviewFlagged
          in: query
          description: >-
            Limit to items flagged for human analyst review (in-scope AND
            security-relevant)
          schema: { type: boolean }
        - name: eligible
          in: query
          description: >-
            Limit to items eligible for promotion (alias of promotable;
            security-relevant AND credible AND not yet promoted)
          schema: { type: boolean }
        - name: limit
          in: query
          description: Max number of most-recent items to return (1-200)
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialRawItem" }

  /social-raw/{id}/promote:
    post:
      operationId: promoteSocialRawItem
      tags: [social-raw]
      summary: >-
        Promote a security-relevant, credible Facebook OSINT item into an
        incident. The server RE-DERIVES eligibility from the stored row (never
        trusting a client claim): the item must be security-relevant AND credible
        (declared official/local-media page, a linked credible domain, or
        cross-feed corroboration), and must not duplicate an existing incident.
        Armed/violent-crime categories file under conflict; protest / policing /
        governance categories under flashpoint. The created incident links back to
        the source post.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Created — the new incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "404":
          description: Item not found
        "409":
          description: >-
            Item not promotable (not security-relevant / not credible), already
            promoted, or duplicates an existing incident

  /social-raw/{id}/review-status:
    patch:
      operationId: updateSocialRawReviewStatus
      tags: [social-raw]
      summary: >-
        Set the analyst review DECISION on a Facebook OSINT item — Ignore,
        Keep-as-Context, or re-open (pending_review). This NEVER creates or
        modifies an incident; it only moves the item in or out of the actionable
        review queue. "promoted" is reserved for the promote action and is not
        accepted here; a row that has already been promoted cannot be re-decided.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateSocialRawReviewStatusRequest" }
      responses:
        "200":
          description: OK — the updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialRawItem" }
        "400":
          description: Invalid review status
        "404":
          description: Item not found
        "409":
          description: Item already promoted — its review status is fixed

  /maritime-security-events:
    get:
      operationId: listMaritimeSecurityEvents
      tags: [maritime-security-events]
      summary: >-
        ICC CCS / IMB Piracy Reporting Centre maritime piracy & armed-robbery
        events for the current calendar year, stored as a STANDALONE
        maritime-security source (never as incidents, so they never inflate any
        count).
      parameters:
        - name: country
          in: query
          description: Limit to one country (exact match on the parsed IMB country name)
          schema: { type: string }
        - name: limit
          in: query
          description: Max number of most-recent events to return (1-500)
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaritimeSecurityEvent" }

  /incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      parameters:
        - name: topic
          in: query
          schema: { $ref: "#/components/schemas/Topic" }
        - name: country
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { $ref: "#/components/schemas/Severity" }
        - name: days
          in: query
          description: Limit to incidents within the past N days
          schema: { type: integer, minimum: 1, maximum: 365 }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Incident" }
    post:
      operationId: createIncident
      tags: [incidents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }

  /incidents/{id}:
    get:
      operationId: getIncident
      tags: [incidents]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
    patch:
      operationId: updateIncident
      tags: [incidents]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
    delete:
      operationId: deleteIncident
      tags: [incidents]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /incidents/recent:
    get:
      operationId: getRecentIncidents
      tags: [incidents]
      summary: Recent priority incidents across all topics
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Incident" }

  /incidents/by-topic:
    get:
      operationId: getIncidentCountsByTopic
      tags: [incidents]
      summary: Counts of recent incidents grouped by topic
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TopicCount" }

  /strikes:
    get:
      operationId: listStrikes
      tags: [strikes]
      parameters:
        - name: theatre
          in: query
          schema: { $ref: "#/components/schemas/StrikeTheatre" }
        - name: country
          in: query
          schema: { type: string }
        - name: days
          in: query
          description: Limit to strikes within the past N days
          schema: { type: integer, minimum: 1, maximum: 365 }
        - name: munition
          in: query
          schema: { $ref: "#/components/schemas/Munition" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Strike" }
    post:
      operationId: createStrike
      tags: [strikes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StrikeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Strike" }

  /strikes/{id}:
    get:
      operationId: getStrike
      tags: [strikes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Strike" }
    patch:
      operationId: updateStrike
      tags: [strikes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StrikeUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Strike" }
    delete:
      operationId: deleteStrike
      tags: [strikes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /strikes/summary:
    get:
      operationId: getStrikeSummary
      tags: [strikes]
      summary: Aggregated strike counts by munition, infrastructure, and timeline
      parameters:
        - name: theatre
          in: query
          schema: { $ref: "#/components/schemas/StrikeTheatre" }
        - name: days
          in: query
          schema: { type: integer, enum: [7, 14, 30, 60, 90, 120] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrikeSummary" }

  /sources:
    get:
      operationId: listSources
      tags: [sources]
      parameters:
        - name: topic
          in: query
          schema: { $ref: "#/components/schemas/Topic" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SourceStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Source" }
    post:
      operationId: createSource
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }

  /sources/{id}:
    patch:
      operationId: updateSource
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
    delete:
      operationId: deleteSource
      tags: [sources]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /sources/health:
    get:
      operationId: getSourceHealth
      tags: [sources]
      summary: Source health summary counts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceHealth" }

  /integrations/status:
    get:
      operationId: getIntegrationStatus
      tags: [integrations]
      summary: Configuration and health status of external integrations
      description: >
        Unified status for each external integration (GDELT, ReliefWeb,
        Liveuamap, OpenAI). Reports configuration state and graceful-degradation
        evidence only — never the secret values themselves. Public endpoint.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationStatusResponse" }

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      parameters:
        - name: topic
          in: query
          schema: { $ref: "#/components/schemas/Topic" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ReportStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
    post:
