        postedAt: { type: ["string", "null"], format: date-time }
        eventDate: { type: ["string", "null"], format: date-time }
        eventTimeText: { type: ["string", "null"] }
        caption: { type: ["string", "null"] }
        imageUrls:
          type: array
          items: { type: string }
        location: { type: ["string", "null"] }
        city: { type: string }
        province: { type: ["string", "null"] }
        issue: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/SocialWatchStatus" }
        confidence: { type: string }
        url: { type: string }
        country: { type: string }
        topic: { type: string }
        classification: { type: string }
        alertReasons:
          type: array
          items: { type: string }
        promotable: { type: boolean }
        promotedIncidentId: { type: ["integer", "null"] }
        promotedAt: { type: ["string", "null"], format: date-time }
        postedAtDisplay: { type: ["string", "null"] }

    SocialRawItem:
      type: object
      description: >-
        A Facebook OSINT monitoring item (Papua New Guinea / Indonesian Papua)
        stored as supporting CONTEXT. NOT an incident: these rows live in their
        own table and never feed any incident count. The only path into incidents
        is the explicit promote action, which the server re-derives and which sets
        promotedIncidentId. The stored payload is minimised/redacted (no comments,
        author profiles, PII, or token-bearing URLs).
      required:
        [
          id,
          platform,
          pageHandle,
          sourceTier,
          externalId,
          country,
          category,
          securityRelevant,
          credible,
          corroborated,
          promotionTopic,
          url,
          classification,
          promotable,
          detectedKeywords,
          confidence,
          reviewFlag,
          reviewStatus,
        ]
      properties:
        id: { type: integer }
        sourceName: { type: string }
        platform: { type: string }
        pageHandle: { type: string }
        pageName: { type: ["string", "null"] }
        sourceTier: { type: string }
        externalId: { type: string }
        postedAt: { type: ["string", "null"], format: date-time }
        incidentDate: { type: ["string", "null"], format: date-time }
        caption: { type: ["string", "null"] }
        imageUrls:
          type: array
          items: { type: string }
        links:
          type: array
          items: { type: string }
        detectedCredibleDomains:
          type: array
          items: { type: string }
        country: { type: string }
        province: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        category: { type: string }
        businessImpact: { type: ["string", "null"] }
        securityRelevant: { type: boolean }
        credible: { type: boolean }
        credibilityReason: { type: ["string", "null"] }
        corroborated: { type: boolean }
        corroborationReason: { type: ["string", "null"] }
        corroboratingIncidentId: { type: ["integer", "null"] }
        promotionTopic: { type: string }
        url: { type: string }
        pageUrl: { type: ["string", "null"] }
        classification: { type: string }
        promotable: { type: boolean }
        engagement:
          description: >-
            Minimised public engagement counts (likes/comments/shares) when the
            provider returns them — context only, never PII.
          oneOf:
            - type: object
              additionalProperties: { type: ["integer", "null"] }
            - type: "null"
        detectedKeywords:
          type: array
          items: { type: string }
        confidence: { type: integer }
        reviewFlag: { type: boolean }
        reviewReason: { type: ["string", "null"] }
        reviewStatus:
          type: string
          description: >-
            Analyst review DECISION: pending_review (default) | ignored | context
            | promoted. Distinct from the auto-derived reviewFlag triage. Drives
            the actionable queue.
        promotedIncidentId: { type: ["integer", "null"] }
        promotedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: ["string", "null"], format: date-time }

    UpdateSocialRawReviewStatusRequest:
      type: object
      required: [reviewStatus]
      properties:
        reviewStatus:
          type: string
          enum: [pending_review, ignored, context]
          description: >-
            The analyst decision. "promoted" is NOT accepted here — it is set only
            by the promote action.

